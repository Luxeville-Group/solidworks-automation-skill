name: SolidWorks Automation Skill
authors: [wzyn20051216, zuoliangyu]
category: Tool
tags: [SolidWorks, CAD, AutoCAD, Desktop, PySide6, MCP, Python, COM, Automation, VibeCAD, Subskills]
status: in-progress
updated: 2026-07-25
summary: SolidWorks automation for Codex, Claude and OpenClaw, covering parts, assemblies, drawings, export, review and local MCP, with a desktop CAD workbench. Turkish/English fork.

readme: README.md

links:
  github: https://github.com/Luxeville-Group/solidworks-automation-skill

subskills:
  - name: solidworks-vibecad
    status: experimental
    path: subskills/solidworks-vibecad
    summary: Natural-language requirements to parametric plans, manufacturing checks, execution outlines and review gates.
  - name: solidworks-fillet-chamfer-cnc
    status: stable
    path: subskills/solidworks-fillet-chamfer-cnc
    summary: CNC mounting bases, parameter/collision checks, semantic edge selection, bounded dimension fallback, holes, slots and rounded pockets.
  - name: solidworks-threaded-holes
    status: stable
    path: subskills/solidworks-threaded-holes
    summary: M3-M12 threads, tap-drill holes, mouth chamfers, thread properties and STEP export.
  - name: solidworks-engineering-drawing
    status: pilot
    path: subskills/solidworks-engineering-drawing
    summary: GB/T first-angle part/assembly drawings, dimension chains, hole tables, BOM, PDF/BMP evidence and manufacturing-delivery review.
  - name: autocad-automation
    status: stable
    path: subskills/autocad-automation
    summary: AutoCAD DWG/DXF 2D drafting, line-art vectorization, layers/text/dimensions, export and drawing review.
