  "backend_catalog": {
    "solidworks-com-pywin32": {
      "language": "Python",
      "runtime": "out_of_process_automation",
      "suitable_for": ["Short-lived macro-style tasks", "Automation-compatible interfaces", "Parameters with explicitly constructed VARIANT/SAFEARRAY values"],
      "limitations": ["Cannot call pointer interfaces officially restricted to in-process unmanaged C++", "Not the preferred backend for long-lived event callbacks or complex UI lifecycles"]
    },
    "solidworks-com-comtypes": {
      "language": "Python",
      "runtime": "out_of_process_automation",
      "suitable_for": ["Independent COM marshaling fallback when pywin32 marshaling fails", "Automation interfaces such as Pack and Go"],
      "limitations": ["Not a replacement for native pointer interfaces", "Read back artifacts; successful calls alone do not establish successful delivery"]
    },
    "solidworks-csharp-pia": {
      "language": "C#",
      "runtime": "out_of_process_managed",
      "suitable_for": ["Strongly typed PIA parameters", "object/out parameters and SAFEARRAY", "Cross-checking Python COM marshaling"],
      "limitations": ["Cannot call interfaces officially restricted to in-process unmanaged C++", "Out-of-process calls remain subject to SolidWorks main-thread and version behavior"]
    },
    "solidworks-csharp-addin": {
      "language": "C#",
      "runtime": "in_process_managed_addin",
      "suitable_for": ["Event subscriptions", "PropertyManagerPage", "TaskPane", "Long-lived UI callbacks"],
      "limitations": ["Requires registration, signing and trusted deployment", "Does not replace pointer interfaces restricted to unmanaged C++"]
    },
    "solidworks-native-cpp": {
      "language": "C++",
      "runtime": "in_process_unmanaged",
      "suitable_for": ["Officially restricted in-process I* pointer interfaces", "Bulk low-level geometry reads", "Exact native semantics"],
      "limitations": ["Highest host-crash risk; requires isolation, version restrictions and native regression", "Cannot bypass licenses, missing add-ins or data absent from the API"]
    },
    "solidworks-swbasic": {
      "language": "SWBasic/VBA",
      "runtime": "solidworks_main_thread_macro",
      "suitable_for": ["Dispatching back to the SolidWorks main thread", "Minimal reproductions and compatibility diagnostics"],
      "limitations": ["Cannot call pointer interfaces restricted to unmanaged C++", "Not suitable for large maintainable executors"]
    },
    "headless-occt-python": {
      "language": "Python/C++ bindings",
      "runtime": "headless_open_format",
      "suitable_for": ["Open formats such as STEP/IGES/BREP/STL", "Geometry construction, inspection and preview without SolidWorks"],
      "limitations": ["Cannot generate or verify native SLDPRT/SLDASM/SLDDRW feature-tree semantics"]
    },
    "autocad-dotnet": {
      "language": "C#",
      "runtime": "in_process_managed_plugin",
      "suitable_for": ["AutoCAD database transactions", "Native DWG writing", "Allowlisted commands when ActiveX proxies are unstable"],
      "limitations": ["Requires managed references matching the AutoCAD major version and trusted plugin deployment"]
    },
    "external-solver-python": {
      "language": "Python + solver native executable",
      "runtime": "external_process",
      "suitable_for": ["CalculiX/Elmer input generation, solver orchestration and result audits"],
      "limitations": ["Requires an installed solver, material/boundary-condition evidence and engineer review"]
    },
    "local-python": {
      "language": "Python",
      "runtime": "local_process",
      "suitable_for": ["Requirements planning", "Evidence, DFM, manifest and file audits"],
      "limitations": ["Do not claim proprietary CAD features are verified from file metadata alone"]
    }
